<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Website requests</title>
<style>
/* Every color and font here comes from the client's brand record (see applyBrand). */
:root{--paper:#fff;--ink:#222;--brand:#444;--on-brand:#fff;--head:Georgia,serif;--body:system-ui,-apple-system,"Segoe UI",Arial,sans-serif;
  --muted:color-mix(in srgb,var(--ink) 66%,var(--paper));--line:color-mix(in srgb,var(--ink) 16%,var(--paper));--soft:color-mix(in srgb,var(--brand) 7%,var(--paper));
  --sub:color-mix(in srgb,var(--on-brand) 82%,var(--brand));color-scheme:light}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);min-height:100vh;display:flex;flex-direction:column}
[hidden]{display:none!important}
.head{background:var(--brand);color:var(--on-brand);padding:20px clamp(16px,4vw,36px);display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.head .id{display:grid;gap:6px;min-width:0}
.head img{height:46px;max-width:240px;width:auto;object-fit:contain;object-position:left;display:block}
.head .nm{font:500 24px/1.15 var(--head)}
.head .sub{font-size:13px;color:var(--sub)}
.tabs{display:flex;gap:4px}
.tabs button{all:unset;cursor:pointer;font-size:14px;padding:7px 12px;border-radius:7px;color:var(--sub)}
.tabs button[aria-selected="true"]{background:var(--on-brand);color:var(--brand)}
.tabs button:focus-visible{outline:2px solid var(--on-brand);outline-offset:2px}
main{flex:1;width:100%;max-width:720px;margin:0 auto;padding:28px clamp(16px,4vw,36px) 36px}
form,.stack{display:grid;gap:22px}
.f{display:grid;gap:7px;min-width:0}
.f>label,.f>.lab{font-weight:500;font-size:15px}
.f small{color:var(--muted);font-size:13px}
input,select,textarea{font:inherit;color:inherit;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);border-color:var(--brand)}
textarea{min-height:104px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{all:unset;cursor:pointer;padding:8px 13px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.chip:focus-visible,.go:focus-visible,.link:focus-visible,summary:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.drop{border:1px dashed var(--brand);border-radius:8px;padding:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--soft);font-size:14px;cursor:pointer}
.drop.over{background:var(--line)}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumb{position:relative;width:76px;height:54px}
.thumb img{width:100%;height:100%;object-fit:cover;border-radius:5px;display:block}
.thumb button{all:unset;cursor:pointer;position:absolute;top:-6px;right:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:13px;line-height:20px;text-align:center}
.go{all:unset;cursor:pointer;background:var(--brand);color:var(--on-brand);padding:12px 22px;border-radius:8px;font-weight:500;justify-self:start}
.go[disabled]{opacity:.55;cursor:default}
.go.small{padding:9px 16px;font-size:14px}
.err{color:#A32020;font-size:14px;margin:0}
.bot{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
h2.big{font:500 34px/1.15 var(--head);margin:0}
h2.big span{color:var(--brand)}
h3{font:600 12px/1.4 var(--body);letter-spacing:.13em;text-transform:uppercase;color:var(--brand);margin:0}
.ok{display:grid;gap:10px;padding:18px 0}
.ok p{margin:0;color:var(--muted)}
.link{all:unset;cursor:pointer;color:var(--brand);text-decoration:underline;justify-self:start}
.req{border-bottom:1px solid var(--line);padding:14px 0}
.req summary{list-style:none;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.req summary::-webkit-details-marker{display:none}
.req b{font-weight:500;overflow-wrap:anywhere}
.m{font-size:13px;color:var(--muted);grid-column:1}
.st{font-size:12px;padding:3px 9px;border-radius:999px;white-space:nowrap;align-self:start;background:#EFEDEA;color:#55524E}
.st.needs{background:#F7E4E2;color:#932A20}.st.inprog{background:#F4EAD6;color:#6F5219}.st.done{background:#E2EEEA;color:#2B5448}
.prog{grid-column:1/-1;list-style:none;margin:10px 0 2px;padding:0;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;font-size:12px;color:var(--muted)}
.prog li{border-top:3px solid var(--line);padding-top:5px;min-width:0}
.prog li.on{border-top-color:var(--brand)}
.prog li.now{color:var(--ink);font-weight:600}
.body{display:grid;gap:10px;margin-top:12px;font-size:15px}
.body p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.msg{padding:10px 12px;background:var(--soft);border-radius:8px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.mine{background:transparent;border:1px solid var(--line)}
.msg img{display:block;max-width:100%;max-height:260px;border-radius:6px;margin-top:8px}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shots img{max-width:100%;max-height:220px;border-radius:6px;border:1px solid var(--line)}
.ans{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;white-space:normal}
.ans input[type=text]{flex:1 1 180px}
.ans label{font-size:13px;align-self:center;cursor:pointer;text-decoration:underline;color:var(--brand)}
.past{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:28px;padding-bottom:6px}
.past input{max-width:240px;padding:7px 10px;font-size:14px}
.empty{color:var(--muted);margin:12px 0}
.foot{border-top:1px solid var(--line);padding:14px clamp(16px,4vw,36px);font-size:12px;color:var(--muted);text-align:center}
.notice{max-width:520px;margin:12vh auto;padding:0 16px;text-align:center;color:var(--muted)}
.notice h1{font:500 26px/1.2 var(--head);color:var(--ink);margin:0 0 8px}
@media(max-width:720px){.two{grid-template-columns:minmax(0,1fr)}.head .tabs{width:100%}}
</style>
</head>
<body>
<div id="blank" class="notice"><p>Loading…</p></div>

<div id="page" hidden style="display:contents">
  <header class="head">
    <div class="id"><span id="logoSlot"></span><div class="sub">Website requests</div></div>
    <div class="tabs" role="tablist">
      <button role="tab" id="tabForm" aria-selected="true">New request</button>
      <button role="tab" id="tabList" aria-selected="false">My requests</button>
    </div>
  </header>
  <main>
    <form id="form" novalidate>
      <div class="f"><span class="lab" id="typeLab">What do you need?</span><div class="chips" id="types" role="group" aria-labelledby="typeLab"></div></div>
      <div class="two">
        <div class="f"><label for="pg">Which page?</label><select id="pg"></select></div>
        <div class="f"><label for="seen">Where did you see it?</label>
          <select id="seen"><option>On a computer</option><option>On a phone</option><option>Both</option><option>Doesn't apply</option></select></div>
      </div>
      <div class="f" id="pgOtherWrap" hidden><label for="pgOther">Page link</label><input id="pgOther" maxlength="300" placeholder="Paste the link"></div>
      <div class="f"><label for="sum">Short summary</label><input id="sum" maxlength="140" required></div>
      <div class="f"><label for="det">Details</label><textarea id="det" maxlength="5000" required></textarea></div>
      <div class="f"><span class="lab">Screenshots</span>
        <label class="drop" id="drop" tabindex="0"><span>Drag, paste or browse. Up to 3 images.</span><input id="file" type="file" accept="image/*" multiple hidden></label>
        <div class="thumbs" id="thumbs"></div>
        <input id="video" maxlength="500" aria-label="Video or file link" placeholder="Video or large file? Paste a Loom or Drive link"></div>
      <div class="f"><span class="lab" id="urgLab">How soon?</span><div class="chips" id="urg" role="group" aria-labelledby="urgLab"></div></div>
      <div class="two">
        <div class="f"><label for="nm">Your name</label><input id="nm" maxlength="100" autocomplete="name" required></div>
        <div class="f"><label for="em">Email</label><input id="em" type="email" maxlength="200" autocomplete="email" required></div>
      </div>
      <div class="bot" aria-hidden="true"><label>Leave this empty<input id="hp" tabindex="-1" autocomplete="off"></label></div>
      <p class="err" id="formErr" role="alert" hidden></p>
      <button class="go" id="send" type="submit">Send request</button>
    </form>

    <div id="sent" hidden>
      <div class="ok"><h3>Received</h3><h2 class="big">Request <span id="sentId"></span> is in.</h2>
        <p>Status updates here on its own, from Submitted to Viewed to In progress to Completed. Come back to this link any time.</p>
        <button class="link" id="seeReq">See my requests</button></div>
    </div>

    <div id="list" hidden>
      <div class="stack" style="gap:0"><h3>Current requests</h3><div id="current"></div></div>
      <div class="past"><h3>Past requests</h3><input id="pastq" aria-label="Search past requests" placeholder="Search past requests"></div>
      <div id="pastList"></div>
    </div>
  </main>
  <footer class="foot" id="foot"></footer>
</div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,doc,getDoc,getDocs,collection,onSnapshot,runTransaction,addDoc,updateDoc,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyDqSNiF9EP_rV2rDRo1lf7IFqrKVPQ6tgw",authDomain:"anomaly-post-pipeline.firebaseapp.com",projectId:"anomaly-post-pipeline",appId:"1:657647176747:web:cee710794e2b04a3572e6e"});
const db=getFirestore(app);
const $=s=>document.querySelector(s);
const esc=v=>String(v==null?"":v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const TOKEN=new URLSearchParams(location.search).get("c")||"";
const TYPES=["Something's broken","Change text","Swap a photo or video","Design tweak","New page or feature","Other"];
const URGS=["Urgent: site down or losing leads","This week","When you can"];
const STEPS=["Submitted","Viewed","In progress","Completed"];
const LABEL={submitted:"Submitted",viewed:"Viewed",progress:"In progress",needs:"Needs more",done:"Completed"};
const MAX_SHOTS=3, MAX_IMG=700000;
let portal=null, tickets=[], shots=[], msgSubs={}, msgs={}, openIds=new Set(), drafts={}, answerImg={};

const pad=n=>String(n).padStart(3,"0");
const dispId=t=>`${portal.abbr}-${pad(t.num)}`;
const labelOf=t=>{ if(t.status==="needs"&&t.awaitingTeam) return "In progress"; return LABEL[t.status]||"Submitted"; };
const ms=v=>v&&v.toMillis?v.toMillis():(typeof v==="number"?v:0);
function ago(v){const d=Date.now()-ms(v); if(!ms(v))return "just now"; const m=Math.round(d/6e4); if(m<60)return (m<1?1:m)+"m ago"; const h=Math.round(m/60); if(h<36)return h+"h ago"; const dd=Math.round(h/24); if(dd<14)return dd+"d ago"; return Math.round(dd/7)+"w ago";}
const safeImg=v=>typeof v==="string"&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(v)?v:"";

function notice(title,text){ $("#page").hidden=true; const b=$("#blank"); b.hidden=false; b.innerHTML=`<h1>${esc(title)}</h1><p>${esc(text)}</p>`; }

/* ── brand: every token comes from the client's record ── */
function applyBrand(p){
  const b=p.brand||{}, r=document.documentElement.style, hex=/^#[0-9a-f]{6}$/i;
  if(hex.test(b.primary))r.setProperty("--brand",b.primary);
  if(hex.test(b.onPrimary))r.setProperty("--on-brand",b.onPrimary);
  if(hex.test(b.ink))r.setProperty("--ink",b.ink);
  if(hex.test(b.paper))r.setProperty("--paper",b.paper);
  const clean=f=>String(f||"").replace(/[^A-Za-z0-9 \-]/g,"").trim();
  const stack=(local,web,rest)=>[clean(local),clean(web)].filter(Boolean).map(n=>`"${n}"`).concat(rest).join(",");
  /* an installed brand font wins where the device has it; otherwise the Google font loads */
  if(b.headFont||b.headLocal)r.setProperty("--head",stack(b.headLocal,b.headFont,"Georgia,serif"));
  if(b.bodyFont||b.bodyLocal)r.setProperty("--body",stack(b.bodyLocal,b.bodyFont,'system-ui,-apple-system,"Segoe UI",Arial,sans-serif'));
  const web=(b.webFonts||[]).map(clean).filter(Boolean);
  if(web.length){const l=document.createElement("link");l.rel="stylesheet";
    l.href="https://fonts.googleapis.com/css2?"+web.map(f=>"family="+encodeURIComponent(f)+":wght@400;500;600").join("&")+"&display=swap";document.head.appendChild(l);}
  document.title=`${p.clientName} · Website requests`;
  const logo=typeof b.logo==="string"&&(safeImg(b.logo)||/^logos\/clients\/[\w.\-]+$/.test(b.logo))?b.logo:"";
  $("#logoSlot").innerHTML=logo?`<img src="${esc(safeImg(logo)||"../"+logo)}" alt="${esc(p.clientName)}">`:`<div class="nm">${esc(p.clientName)}</div>`;
  $("#foot").textContent=`Anyone with this link can file a request for ${p.clientName}. Website support by Anomaly Creative & Co.`;
}

/* ── form ── */
function chips(el,list,on){el.innerHTML=list.map(x=>`<button type="button" class="chip" aria-pressed="${x===on}">${esc(x)}</button>`).join("");
  el.querySelectorAll(".chip").forEach(c=>c.onclick=()=>el.querySelectorAll(".chip").forEach(o=>o.setAttribute("aria-pressed",o===c)));}
const chipVal=el=>{const c=el.querySelector('[aria-pressed="true"]');return c?c.textContent:"";};

function buildForm(){
  chips($("#types"),TYPES,"");
  chips($("#urg"),URGS,"This week");
  const pages=(portal.pages&&portal.pages.length?portal.pages:["Home","Contact"]);
  $("#pg").innerHTML=pages.map(p=>`<option>${esc(p)}</option>`).join("")+`<option>All pages</option><option>Another page (paste the link)</option>`;
  $("#pg").onchange=()=>{$("#pgOtherWrap").hidden=!$("#pg").value.startsWith("Another");};
  try{ $("#nm").value=localStorage.getItem("ticket-name")||""; $("#em").value=localStorage.getItem("ticket-email")||""; }catch(e){}
}

async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((ok,no)=>{const i=new Image();i.onload=()=>ok(i);i.onerror=no;i.src=url;});
    let max=1600,q=.8,out="";
    for(let k=0;k<7;k++){
      const s=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));
      const c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*s);c.height=Math.round(img.naturalHeight*s);
      c.getContext("2d").drawImage(img,0,0,c.width,c.height);
      out=c.toDataURL("image/jpeg",q);
      if(out.length<=MAX_IMG)return out;
      if(q>.55)q-=.12;else max=Math.round(max*.8);
    }
    throw new Error("too big");
  }finally{URL.revokeObjectURL(url);}
}
function drawThumbs(){
  $("#thumbs").innerHTML=shots.map((s,i)=>`<div class="thumb"><img src="${s}" alt="Screenshot ${i+1}"><button type="button" data-i="${i}" aria-label="Remove screenshot ${i+1}">×</button></div>`).join("");
  $("#thumbs").querySelectorAll("button").forEach(b=>b.onclick=()=>{shots.splice(+b.dataset.i,1);drawThumbs();});
}
async function addFiles(files){
  const err=$("#formErr"); err.hidden=true;
  for(const f of files){
    if(!f.type.startsWith("image/"))continue;
    if(shots.length>=MAX_SHOTS){err.textContent="Up to 3 images. Paste a Loom or Drive link for anything more.";err.hidden=false;break;}
    try{shots.push(await compress(f));}catch(e){err.textContent="That image couldn't be added. Try a smaller one.";err.hidden=false;}
  }
  drawThumbs();
}
function wireDrop(){
  const d=$("#drop"), f=$("#file");
  f.onchange=()=>{addFiles([...f.files]);f.value="";};
  d.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f.click();}};
  ["dragenter","dragover"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.add("over");}));
  ["dragleave","drop"].forEach(ev=>d.addEventListener(ev,e=>{e.preventDefault();d.classList.remove("over");}));
  d.addEventListener("drop",e=>addFiles([...e.dataTransfer.files]));
  document.addEventListener("paste",e=>{if($("#form").hidden)return;const fs=[...(e.clipboardData?.files||[])];if(fs.length)addFiles(fs);});
}

async function submit(e){
  e.preventDefault();
  const err=$("#formErr"); err.hidden=true;
  const fail=t=>{err.textContent=t;err.hidden=false;};
  if($("#hp").value){showSent("");return;} // a bot filled the hidden field: pretend it worked
  const type=chipVal($("#types")), title=$("#sum").value.trim(), details=$("#det").value.trim(), name=$("#nm").value.trim(), email=$("#em").value.trim();
  const other=$("#pg").value.startsWith("Another");
  const page=other?$("#pgOther").value.trim():$("#pg").value;
  if(!type)return fail("Choose what you need.");
  if(!page)return fail("Paste the link to the page.");
  if(!title||!details)return fail("Add a short summary and details.");
  if(!name||!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return fail("Add your name and a valid email so we can reach you.");
  const btn=$("#send"); btn.disabled=true; btn.textContent="Sending…";
  try{
    const video=$("#video").value.trim();
    const pref=doc(db,"ticketPortals",TOKEN);
    const num=await runTransaction(db,async tx=>{
      const snap=await tx.get(pref);
      if(!snap.exists()||!snap.data().active) throw new Error("paused");
      const n=(snap.data().seq||0)+1, id=String(n), tref=doc(db,"ticketPortals",TOKEN,"tickets",id);
      tx.update(pref,{seq:n});
      tx.set(tref,{num:n,abbr:portal.abbr,title,details,type,page,seen:$("#seen").value,urgency:chipVal($("#urg")),video,
        fileCount:shots.length,status:"submitted",archived:false,awaitingTeam:false,createdAt:serverTimestamp()});
      tx.set(doc(db,"ticketPortals",TOKEN,"tickets",id,"private","contact"),{name,email});
      shots.forEach((data,i)=>tx.set(doc(db,"ticketPortals",TOKEN,"tickets",id,"files",String(i+1)),{data}));
      return n;
    });
    try{localStorage.setItem("ticket-name",name);localStorage.setItem("ticket-email",email);}catch(e){}
    showSent(`${portal.abbr}-${pad(num)}`);
    ["#sum","#det","#video","#pgOther"].forEach(s=>$(s).value="");shots=[];drawThumbs();chips($("#types"),TYPES,"");
  }catch(x){
    console.error(x);
    fail(x.message==="paused"?"This link is paused. Please contact Anomaly.":"That didn't send. Check your connection and try again. Your text is still here.");
  }finally{btn.disabled=false;btn.textContent="Send request";}
}
function showSent(id){$("#sentId").textContent=id;setView("sent");}

/* ── tickets ── */
function stepper(label){const at=label==="Needs more"?2:STEPS.indexOf(label);
  return `<ol class="prog" aria-label="Progress: ${esc(label)}">${STEPS.map((n,i)=>`<li class="${i<=at?"on":""}${i===at?" now":""}">${i===2&&label==="Needs more"?"Needs more":n}</li>`).join("")}</ol>`;}
const pill=l=>({"In progress":"inprog","Needs more":"needs","Completed":"done"}[l]||"");
function msgHtml(m){const who=m.from==="client"?"You":"Anomaly"+(m.kind==="ask"?" needs more":"");const img=safeImg(m.image);
  return `<div class="msg${m.from==="client"?" mine":""}"><b>${who}:</b> ${esc(m.text)}${img?`<img src="${img}" alt="Attached image">`:""}</div>`;}
function ticketHtml(t,past){
  const l=past?"Completed":labelOf(t), mine=(msgs[t.id]||[]), open=openIds.has(t.id);
  const lastAsk=t.status==="needs"&&!t.awaitingTeam&&!past;
  const video=/^https:\/\//i.test(t.video||"")?`<p><a href="${esc(t.video)}" target="_blank" rel="noopener noreferrer">Attached link</a></p>`:"";
  return `<details class="req" data-t="${t.id}"${open||lastAsk?" open":""}><summary><b>${esc(t.title)}</b><span class="st ${pill(l)}">${esc(l)}</span>
    <span class="m">${esc(dispId(t))} · ${esc(t.page)} · ${past?"closed "+ago(t.closedAt||t.createdAt):"filed "+ago(t.createdAt)}</span>${past?"":stepper(l)}</summary>
    <div class="body"><p>${esc(t.details)}</p>${video}<div class="shots" data-shots="${t.id}"></div>${mine.map(msgHtml).join("")}
    ${lastAsk?`<form class="ans" data-ans="${t.id}"><input type="text" aria-label="Your answer" placeholder="Type your answer" maxlength="3000" value="${esc(drafts[t.id]||"")}"><label>${answerImg[t.id]?"Image added":"Add an image"}<input type="file" accept="image/*" hidden></label><button class="go small">Send</button></form>`:""}
    </div></details>`;
}
function drawList(){
  const cur=tickets.filter(t=>!t.archived).sort((a,b)=>b.num-a.num), past=tickets.filter(t=>t.archived).sort((a,b)=>b.num-a.num);
  const active=document.activeElement, focusId=active&&active.closest?.("[data-ans]")?.dataset.ans;
  $("#current").innerHTML=cur.length?cur.map(t=>ticketHtml(t,false)).join(""):`<p class="empty">No current requests.</p>`;
  const q=$("#pastq").value.trim().toLowerCase();
  const hit=past.filter(t=>(t.title+dispId(t)+t.page+t.details).toLowerCase().includes(q));
  $("#pastList").innerHTML=hit.length?hit.map(t=>ticketHtml(t,true)).join(""):`<p class="empty">${past.length?"No past requests match that search.":"No past requests yet."}</p>`;
  $("#tabList").textContent=`My requests (${cur.length})`;
  document.querySelectorAll("details.req").forEach(d=>{
    if(d.open)loadShots(d.dataset.t);
    d.addEventListener("toggle",()=>{if(d.open){openIds.add(d.dataset.t);loadShots(d.dataset.t);watchMsgs(d.dataset.t);}else openIds.delete(d.dataset.t);});
  });
  document.querySelectorAll("form[data-ans]").forEach(f=>{
    const id=f.dataset.ans, inp=f.querySelector('input[type=text]');
    inp.oninput=()=>{drafts[id]=inp.value;};
    f.querySelector('input[type=file]').onchange=async ev=>{const x=ev.target.files[0];if(!x)return;try{answerImg[id]=await compress(x);drawList();}catch(e){}};
    f.onsubmit=e=>{e.preventDefault();answer(id);};
    if(focusId===id)inp.focus();
  });
}
const shotCache={};
async function loadShots(id){
  const t=tickets.find(x=>x.id===id); if(!t||!t.fileCount)return;
  if(!shotCache[id]){
    shotCache[id]=getDocs(collection(db,"ticketPortals",TOKEN,"tickets",id,"files")).then(s=>s.docs.map(d=>safeImg(d.data().data)).filter(Boolean)).catch(()=>[]);
  }
  const list=await shotCache[id]; const el=document.querySelector(`[data-shots="${id}"]`);
  if(el)el.innerHTML=list.map((s,i)=>`<img src="${s}" alt="Screenshot ${i+1}">`).join("");
}
function watchMsgs(id){
  if(msgSubs[id])return;
  msgSubs[id]=onSnapshot(collection(db,"ticketPortals",TOKEN,"tickets",id,"messages"),s=>{
    msgs[id]=s.docs.map(d=>d.data()).sort((a,b)=>ms(a.at)-ms(b.at));
    if(!$("#list").hidden)drawList();
  },e=>console.warn(e));
}
async function answer(id){
  const text=(drafts[id]||"").trim(), image=answerImg[id]||"";
  if(!text&&!image)return;
  const m={from:"client",text:text||"(image attached)",at:serverTimestamp()}; if(image)m.image=image;
  try{
    await addDoc(collection(db,"ticketPortals",TOKEN,"tickets",id,"messages"),m);
    await updateDoc(doc(db,"ticketPortals",TOKEN,"tickets",id),{awaitingTeam:true,lastClientAt:serverTimestamp()});
    delete drafts[id];delete answerImg[id];
  }catch(x){console.error(x);alert("That didn't send. Check your connection and try again.");}
}

/* ── views ── */
function setView(v){
  $("#form").hidden=v!=="form";$("#sent").hidden=v!=="sent";$("#list").hidden=v!=="list";
  $("#tabForm").setAttribute("aria-selected",v!=="list");$("#tabList").setAttribute("aria-selected",v==="list");
  if(v==="list")drawList();
  try{history.replaceState(null,"",location.pathname+location.search+(v==="list"?"#requests":""));}catch(e){}
}
$("#tabForm").onclick=()=>setView("form");
$("#tabList").onclick=()=>setView("list");
$("#seeReq").onclick=()=>setView("list");
$("#pastq").oninput=drawList;
$("#form").addEventListener("submit",submit);

/* ── boot ── */
(async()=>{
  if(!/^[a-z0-9\-]{10,80}$/.test(TOKEN))return notice("This link isn't valid","Please check the link, or ask Anomaly for a new one.");
  let snap;
  try{snap=await getDoc(doc(db,"ticketPortals",TOKEN));}
  catch(e){console.error(e);return notice("We couldn't load this page","Check your connection and refresh.");}
  if(!snap.exists())return notice("This link isn't active","Please ask Anomaly for the current link.");
  portal=snap.data();
  applyBrand(portal);
  if(!portal.active)return notice(`${portal.clientName} requests are paused`,"Please contact Anomaly directly for now.");
  buildForm();wireDrop();
  $("#blank").hidden=true;$("#page").hidden=false;$("#page").style.display="contents";
  onSnapshot(collection(db,"ticketPortals",TOKEN,"tickets"),s=>{
    tickets=s.docs.map(d=>({id:d.id,...d.data()}));
    tickets.filter(t=>!t.archived).forEach(t=>watchMsgs(t.id));
    $("#tabList").textContent=`My requests (${tickets.filter(t=>!t.archived).length})`;
    if(!$("#list").hidden)drawList();
  },e=>console.warn(e));
  setView(location.hash==="#requests"?"list":"form");
})();
</script>
